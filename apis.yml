name: Mochacare
description: >-
  MochaCare is an AI-powered operations platform for home care agencies and care
  facilities, combining human virtual assistants with AI agents to run hiring,
  scheduling, and client-intake operations end-to-end. The company offers two
  products: Mocha Managed, a 24/7 managed service where its team handles hiring
  and scheduling, and Mocha Tools, an AI software platform featuring an applicant
  tracking system, automated shift scheduling, shift-coverage management, document
  collection, and growth analytics. MochaCare builds custom integrations with
  existing care-agency systems (WellSky, AxisCare, AlayaCare), plus hiring and
  communication tools (Indeed, RingCentral), but does not publish a public
  developer API, developer portal, or API documentation. A Y Combinator portfolio
  company founded by Nick Walker and Pranav Uppiliappan.
